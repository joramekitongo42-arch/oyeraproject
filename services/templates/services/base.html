<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyera Autobay - Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .table thead th { font-weight: 600; color: #495057; border-bottom-width: 1px; }
        .plate-badge {
            font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
            letter-spacing: .03em;
            background: #212529;
            color: #fff;
            padding: .2rem .5rem;
            border-radius: .3rem;
            font-size: .85rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard:dashboard_index' %}">Autobay</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'dashboard:dashboard_index' %}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="{% url 'services:service_list' %}">Services</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
