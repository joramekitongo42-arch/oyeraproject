{% extends 'services/base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger-subtle">
            <div class="card-body text-center py-4">
                <i class="bi bi-exclamation-triangle text-danger fs-1"></i>
                <h4 class="fw-bold mt-3">Delete this record?</h4>
                <p class="text-muted">"{{ object }}" will be permanently removed. This can't be undone.</p>
                <form method="post" class="d-flex justify-content-center gap-2 mt-3">
                    {% csrf_token %}
                    <a href="{% url 'services:service_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
